# Camp EKKO 2026 - Rocky Mountains onsite vendors.

- id: winnebago
  event: rockymtns-2026
  name: Winnebago
  location: Campsites 146–149
  description: >-
    Winnebago will have leaders from the EKKO Production team as well as their Marketing team onsite.
    The marketing team will be volunteering at the Welcome Tent on arrival day, as well as throughout
    the event, including monitoring the Silent Auction for us. We're so grateful they took the time to
    join us! We're also thankful for the generous monetary donation that made it possible for us to
    purchase the fundraiser tshirts. Thanks, Winnebago!

- id: habitat-rv-care-a-vanners
  event: rockymtns-2026
  name: Habitat RV Care-A-Vanners
  location: Campsite 145
  description: >-
    Ty and Larry are long time volunteers for the Care-A-Vanners and would love it if you'd swing by
    their site so they can tell you all about this awesome non-profit that's so near and dear to their
    hearts.

- id: lithionics
  event: rockymtns-2026
  name: Lithionics
  location: Campsite 143
  description: >-
    Krista and Tim from Lithionics are ready to welcome you to their site and answer any battery or
    electrical questions you may have. Questions about the app? Battery life? Storage? They've got you
    covered.

- id: truma
  event: rockymtns-2026
  name: Truma
  location: Campsite 138
  description: >-
    Truma makes our EKKOs' heaters and water heaters. Lara is here to answer your questions and get your
    feedback, so be sure to swing by.

- id: vanmade-gear
  event: rockymtns-2026
  name: VanMade Gear
  location: Campsite 139
  description: >-
    Simon from VanMade Gear will have samples of all the window coverings he makes at his shop in
    Oregon. You can get your hands on them and compare the differences.

- id: freedomvango
  event: rockymtns-2026
  name: FreedomVanGo
  location: Campsite 137
  description: >-
    Grant is the owner of FreedomVanGo, a well-known upfitters shop within the EKKOsphere. He'll be
    leading loads of talks and also welcomes you to swing by anytime with questions or just to say hi.

- id: house2start
  event: rockymtns-2026
  name: House2Start
  location: Campsite 144
  description: >-
    Danielle & Brad make a clever product to keep your engine starter battery charged. They'll be doing
    onsite installs, so make sure to swing by to get on the list!

- id: fantasy-rv-tours
  event: rockymtns-2026
  name: Fantasy RV Tours
  location: Campsite 140
  description: >-
    Sue & Rich lead group RV tours all over North America, and they'd love to share tips & suggestions
    for your own travels, and also tell you more about how great joining a group tour can be.

- id: overlandgearguy
  event: rockymtns-2026
  name: OverlandGearGuy
  location: Campsite 142
  description: >-
    Rob is a small business owner who creates soft-goods storage solutions for EKKOs, vans, and overland
    vehicles. Swing by and check out his clever products.

- id: campright-usa
  event: rockymtns-2026
  name: CampRight USA
  location: Campsite 329
  note: Onsite Saturday only
  description: >-
    CampRight makes an "L-shaped" dinette kit for TREKKOs. You've got to see these! Swing by and check
    out how fantastic their dinettes are!

- id: inhabit-mats
  event: rockymtns-2026
  name: Inhabit Mats
  location: Campsite 6
  description: >-
    Inhabit Design is a very popular company with EKKO owners; they make awesome floor mats that cover
    the entire EKKO floor. They also have other products, so make sure to swing by and check out their
    stuff!

- id: la-mesa-rvs
  event: rockymtns-2026
  name: La Mesa RVs
  note: Not onsite — remote sponsor
  description: >-
    While they won't be onsite, we wanted to include them here since they gave a large donation towards
    our fundraising tshirts. La Mesa has always been so supportive of our EKKO meetups and rallies,
    consistently providing donations or meals or giveaways at our various rallies. It's unusual for a
    dealership to do this (and wonderful!) — we wanted you all to know that. We appreciate their
    generosity.
